<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

  {% include head.html %}

  <body data-baseurl="{{ site.baseurl }}"
        class="{% if page.url == '/' %}is-homepage{% endif %}">

    <a class="skip-link" href="#main">Skip to content</a>

    {% include icons.svg %}

    {% if page.url == '/' %}

      <!-- Homepage: preserve fullscreen layout -->
      <main id="main" class="site-container home-page-container">
        {{ content }}
      </main>

    {% else %}

      <!-- Other pages: sticky footer layout -->
      <div class="page-wrapper">

        {% include header.html %}

        <main id="main" class="site-container">
          {{ content }}
        </main>

        {% include footer.html %}

      </div>

    {% endif %}

  </body>

</html>
